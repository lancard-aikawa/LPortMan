[project]
name = "lportman"
version = "0.1.0"
description = "Local Port Manager: ローカル開発で使うポートの調査・台帳・衝突検出"
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
lportman = "lportman.cli:main"

[project.gui-scripts]
lportman-gui = "lportman.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lportman"]
